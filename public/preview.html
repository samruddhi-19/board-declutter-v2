<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    /* Trello's power-up.css is deliberately NOT loaded here — it restyles bare
       form controls and fights this sheet. All controls below are self-contained. */

    :root {
      --bg: #ffffff;
      --surface: #f7f8f9;
      --line: #e4e6ea;
      --line-soft: #eef0f2;
      --text: #172b4d;
      --text-dim: #6b778c;
      --accent: #b8600c;
      --accent-soft: #fbf1e6;
      --accent-line: #f0d3ae;
      --green: #1f9d63;
      --green-hover: #18804f;
      --red: #c9372c;
      --red-hover: #ae2e24;
      --red-text: #ffffff;
      --focus: #4c9aff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1620;
        --surface: #161e29;
        --line: #263141;
        --line-soft: #1d2634;
        --text: #dfe6ee;
        --text-dim: #8496a8;
        --accent: #e2a03f;
        --accent-soft: #1e2634;
        --accent-line: #5d4622;
        --green: #2ea86a;
        --green-hover: #35c07c;
        --red: #f87168;
        --red-hover: #ff9c8f;
        --red-text: #1d2125;
        --focus: #579dff;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 13px;
      line-height: 1.4;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ---------- Tabs: one segmented control, not three buttons ---------- */
    .tabbar { flex: 0 0 auto; padding-top: 16px; }

    .tabs {
      display: flex;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text-dim);
      font: inherit;
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: color .12s ease, background-color .12s ease;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      background: var(--bg);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(9, 30, 66, .12);
    }

    .tab-count {
      min-width: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--line);
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 600;
      line-height: 15px;
    }

    .tab.active .tab-count {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* ---------- Action bar ---------- */
    .bar-wrap {
      flex: 0 0 auto;
      border-bottom: 1px solid var(--line);
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0 11px;
    }

    .selectall {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1 1 auto;
      min-width: 0;
      cursor: pointer;
      user-select: none;
    }

    .selectall-text { min-width: 0; }
    .selectall-title { font-size: 12px; font-weight: 600; }
    .selectall-sub {
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      flex: 0 0 auto;
      padding: 0 14px;
      height: 30px;
      border: 0;
      border-radius: 5px;
      background: var(--green);
      color: #fff;
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .03em;
      cursor: pointer;
      transition: background-color .12s ease;
    }

    .btn:hover:not(:disabled) { background: var(--green-hover); }

    /* Destructive action — the Protected tab's un-protect and the archive. */
    .btn.danger { background: var(--red); color: var(--red-text); }
    .btn.danger:hover:not(:disabled) { background: var(--red-hover); }

    /* Archiving needs a token. Until there is one the button is an invitation,
       not the act itself, so it drops to an outline. */
    .btn.outline {
      background: transparent;
      color: var(--red);
      box-shadow: inset 0 0 0 1px currentColor;
    }
    .btn.outline:hover:not(:disabled) { background: var(--accent-soft); }

    .btn.quiet {
      background: transparent;
      color: var(--text-dim);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .btn.quiet:hover:not(:disabled) { color: var(--text); }

    .btn.mini { height: 26px; padding: 0 11px; font-size: 11px; }

    .btn:disabled {
      background: transparent;
      color: var(--text-dim);
      box-shadow: inset 0 0 0 1px var(--line);
      cursor: not-allowed;
    }

    .btn[hidden] { display: none; }

    /* ---------- Custom checkbox (immune to any host stylesheet) ---------- */
    .cbx {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      pointer-events: none;
    }

    .box {
      flex: 0 0 auto;
      position: relative;
      display: block;
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--text-dim);
      border-radius: 4px;
      background: transparent;
      transition: background-color .12s ease, border-color .12s ease;
    }

    .cbx:checked + .box,
    .cbx:indeterminate + .box {
      background: var(--green);
      border-color: var(--green);
    }

    .cbx:checked + .box::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .cbx:indeterminate + .box::after {
      content: '';
      position: absolute;
      left: 2.5px;
      top: 5.5px;
      width: 7px;
      height: 2px;
      border-radius: 1px;
      background: #fff;
    }

    .cbx:focus-visible + .box {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* ---------- Rows: flat list with dividers, not stacked cards ---------- */
    .scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .scroll::-webkit-scrollbar { width: 10px; }
    .scroll::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 6px;
      background: var(--line);
      background-clip: content-box;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 10px;
      margin: 0 -10px;
      border-radius: 5px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer;
    }

    .row:hover { background: var(--surface); }
    .row.sel { background: var(--accent-soft); }

    /* A row that has already left the board during a running archive. */
    .row.done { opacity: .45; pointer-events: none; }

    .row-main { flex: 1 1 auto; min-width: 0; }

    .row-title {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      display: block;
      margin-top: 1px;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-age {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- States ---------- */
    .state {
      padding: 56px 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.6;
    }

    .linkbtn {
      margin-top: 12px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .linkbtn:hover:not(:disabled) { border-color: var(--text-dim); }
    .linkbtn:disabled { color: var(--text-dim); cursor: default; }

    .status {
      flex: 0 0 auto;
      display: none;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .status.show { display: block; }

    .status .shell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 8px;
      padding-bottom: 8px;
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .status-msg { flex: 1 1 auto; min-width: 0; }
    .status-msg strong { color: var(--text); font-weight: 600; }
    .status-actions { flex: 0 0 auto; display: flex; gap: 8px; }

    .status.error .shell { color: #c9372c; }
    .status.ok .shell { color: var(--green); }
    .status.ok .status-msg strong { color: inherit; }

    .track {
      height: 3px;
      margin-top: 5px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
    }

    .track > i {
      display: block;
      height: 100%;
      background: var(--accent);
      transition: width .18s ease;
    }
  </style>
</head>
<body>
  <div class="tabbar">
    <div class="shell">
      <div class="tabs">
        <button class="tab active" data-tab="upcoming">Upcoming Declutter<span class="tab-count" data-count="upcoming">0</span></button>
        <button class="tab" data-tab="past">Past Decluttered<span class="tab-count" data-count="past">0</span></button>
        <button class="tab" data-tab="protected">Protected<span class="tab-count" data-count="protected">0</span></button>
      </div>
    </div>
  </div>

  <div class="bar-wrap">
    <div class="shell">
      <div class="bar">
        <label class="selectall">
          <input type="checkbox" class="cbx" id="selectAll" />
          <span class="box"></span>
          <span class="selectall-text">
            <span class="selectall-title" id="selectAllTitle">Select All</span>
            <span class="selectall-sub" id="selectAllSub">Select the items to protect</span>
          </span>
        </label>
        <button class="btn" id="actionBtn" disabled>PROTECT</button>
        <button class="btn danger" id="archiveBtn" hidden>ARCHIVE</button>
      </div>
    </div>
  </div>

  <div class="scroll">
    <div class="shell" id="list">
      <div class="state">Loading board…</div>
    </div>
  </div>

  <div class="status" id="status">
    <div class="shell">
      <span class="status-msg" id="statusMsg"></span>
      <span class="status-actions" id="statusActions"></span>
    </div>
  </div>

  <script>
    // Must stay identical to the key in settings.html — the token
    // from getRestApi() is issued against this appKey, and pairing it with a
    // different key makes every write fail with a 401.
    const API_KEY = '13984ce4cf66fea26a4e36da6b01ffdc';

    var t = window.TrelloPowerUp.iframe({
      appKey: API_KEY,
      appName: 'Board Declutter'
    });

    const STALE_LIST = 'stale cards';
    const STARTER_LIST = 'trello starter guide';

    const TABS = {
      upcoming: {
        action: 'PROTECT',
        busy: 'PROTECTING…',
        hint: 'Select the items to protect',
        // Shown instead of `hint` when archiving is switched on, because then the
        // same ticks feed two opposite actions.
        archiveHint: 'Protect what should stay, or archive the rest',
        empty: 'Nothing is due for decluttering.<br>Cards past your threshold will show up here.',
        danger: false,
        showAge: true
      },
      past: {
        action: 'UNDO',
        busy: 'RESTORING…',
        hint: 'Select the items to undo',
        empty: 'No cards have been decluttered yet.<br>Archived cards come back to their original list from here.',
        danger: false,
        // A swept card's age says nothing about the sweep, so it is left out here.
        showAge: false
      },
      protected: {
        action: 'UN-PROTECT',
        busy: 'UN-PROTECTING…',
        hint: 'Select the items to unprotect',
        empty: 'No protected cards yet.<br>Protect a card from the Upcoming tab to keep it on the board.',
        danger: true,
        showAge: false
      }
    };

    let currentTab = 'upcoming';
    let lists = [];
    let allCards = [];
    let settings = {};
    let protectedIds = [];
    let rows = [];
    // Archived cards are invisible to t.cards(), so they come from the REST API
    // and need a token. null = not fetched yet (the Past tab asks to authorize).
    let archivedCards = null;
    // Mirrors getRestApi().isAuthorized(). render() needs the answer synchronously
    // to label the archive button, so the async check is cached here.
    let hasToken = false;
    // True while an archive is running — freezes the bar and the tabs.
    let busy = false;

    const listEl = document.getElementById('list');
    const statusEl = document.getElementById('status');
    const statusMsg = document.getElementById('statusMsg');
    const statusActions = document.getElementById('statusActions');
    const actionBtn = document.getElementById('actionBtn');
    const archiveBtn = document.getElementById('archiveBtn');
    const selectAll = document.getElementById('selectAll');
    const selectAllTitle = document.getElementById('selectAllTitle');
    const selectAllSub = document.getElementById('selectAllSub');

    function daysOld(card) {
      const created = parseInt(card.id.substring(0, 8), 16) * 1000;
      return Math.floor((Date.now() - created) / 86400000);
    }

    function listName(id) {
      const l = lists.find(l => l.id === id);
      return l ? l.name : 'Unknown list';
    }

    // The list a swept card came from, recorded as a label named after that list.
    function originList(card) {
      for (const label of (card.labels || [])) {
        const match = lists.find(l => l.name === label.name);
        if (match) return match;
      }
      return null;
    }

    function setStatus(msg, kind) {
      statusEl.className = 'status show' + (kind ? ' ' + kind : '');
      statusMsg.innerHTML = msg;
      statusActions.innerHTML = '';
    }

    function clearStatus() {
      statusEl.className = 'status';
      statusMsg.innerHTML = '';
      statusActions.innerHTML = '';
    }

    // The rules the Upcoming tab is filtering by, stated plainly. Shown only when
    // the strip is otherwise idle, so it never buries a result or an error.
    function showTabInfo() {
      if (statusEl.classList.contains('show')) return;
      if (currentTab !== 'upcoming') return;
      const threshold = Number.isFinite(settings.sweepThreshold) ? settings.sweepThreshold : 30;
      const parts = ['Threshold: ' + threshold + ' day' + (threshold === 1 ? '' : 's')];
      if (settings.ignoreStarter !== false) parts.push('Trello Starter Guide is skipped');
      setStatus(parts.join(' · '));
    }

    // Confirm in the strip rather than a second modal — the list being confirmed
    // stays on screen, which is the whole point of confirming here.
    function askConfirm(msg, label, onConfirm) {
      statusEl.className = 'status show';
      statusMsg.innerHTML = msg;
      statusActions.innerHTML = '';

      const no = document.createElement('button');
      no.className = 'btn quiet mini';
      no.textContent = 'CANCEL';

      const yes = document.createElement('button');
      yes.className = 'btn danger mini';
      yes.textContent = label;

      no.addEventListener('click', function() {
        clearStatus();
        selectAll.disabled = !rows.length;
        syncSelection();
        showTabInfo();
      });

      yes.addEventListener('click', function() {
        statusActions.innerHTML = '';
        onConfirm();
      });

      statusActions.appendChild(no);
      statusActions.appendChild(yes);

      actionBtn.disabled = true;
      archiveBtn.disabled = true;
      selectAll.disabled = true;
    }

    function setProgress(msg, fraction) {
      statusEl.className = 'status show';
      statusActions.innerHTML = '';
      statusMsg.innerHTML = msg +
        '<span class="track"><i style="width:' + Math.round(fraction * 100) + '%"></i></span>';
    }

    function cardsForTab(tab) {
      const threshold = Number.isFinite(settings.sweepThreshold) ? settings.sweepThreshold : 30;
      const ignoreStarter = settings.ignoreStarter !== false;

      if (tab === 'protected') {
        return allCards.filter(c => protectedIds.includes(c.id));
      }

      if (tab === 'past') {
        // Archived cards carrying an origin label are ones this Power-Up swept.
        // Anything archived by hand has no such label and is left alone.
        const archived = (archivedCards || []).filter(c => originList(c));
        // Cards swept before the switch to archiving are still sitting in the
        // old Stale Cards list; undo handles both, so list both.
        const legacy = allCards.filter(c => listName(c.idList).toLowerCase() === STALE_LIST);
        return archived.concat(legacy);
      }

      // upcoming — mirrors the filter used by the sweeper
      return allCards.filter(card => {
        if (protectedIds.includes(card.id)) return false;
        const name = listName(card.idList).toLowerCase();
        if (name === STALE_LIST) return false;
        if (ignoreStarter && name === STARTER_LIST) return false;
        return daysOld(card) >= threshold;
      });
    }

    function refreshCounts() {
      Object.keys(TABS).forEach(function(tab) {
        // Without a token the archive is unknown, so don't claim a total.
        const unknown = tab === 'past' && archivedCards === null;
        document.querySelector('[data-count="' + tab + '"]').textContent =
          unknown ? '–' : cardsForTab(tab).length;
      });
    }

    async function authorize() {
      const isAuth = await t.getRestApi().isAuthorized();
      if (!isAuth) {
        await t.getRestApi().authorize({ scope: 'read,write', expiration: '30days' });
      }
      return t.getRestApi().getToken();
    }

    // Pull the board's archived cards. `interactive` decides whether a missing
    // token is worth an authorize prompt — opening the modal must never prompt.
    async function loadArchived(interactive) {
      if (archivedCards) return archivedCards;

      if (!interactive && !(await t.getRestApi().isAuthorized())) return null;

      const token = await authorize();
      hasToken = true;
      const boardId = t.getContext().board;
      const res = await fetch('https://api.trello.com/1/boards/' + boardId +
        '/cards/closed?fields=id,name,idList,labels,closed&key=' + API_KEY + '&token=' + token);

      if (!res.ok) throw new Error('Could not read the archive (' + res.status + ').');

      archivedCards = await res.json();
      return archivedCards;
    }

    // The archive lives on the Upcoming tab only, and only when the board has
    // switched it on in Settings — the same flag that used to decide whether the
    // board carried a second Power-Up button.
    function canArchive() {
      return currentTab === 'upcoming' && settings.sweepEnabled === true;
    }

    function render() {
      const cfg = TABS[currentTab];
      const cards = cardsForTab(currentTab);

      actionBtn.textContent = cfg.action;
      actionBtn.className = 'btn' + (cfg.danger ? ' danger' : '');
      selectAllSub.textContent = canArchive() ? cfg.archiveHint : cfg.hint;
      archiveBtn.hidden = !canArchive() || !cards.length;
      refreshCounts();

      listEl.innerHTML = '';
      rows = [];

      // The archive can only be read with a token, and we refuse to prompt for
      // one just because the modal opened. Ask here instead, on the tab that
      // actually needs it.
      if (currentTab === 'past' && archivedCards === null) {
        listEl.innerHTML = '<div class="state">Decluttered cards are archived, and Trello only ' +
          'hands those over to an authorized Power-Up.<br>' +
          '<button class="linkbtn" id="loadArchive">Show decluttered cards</button></div>';
        selectAll.checked = false;
        selectAll.indeterminate = false;
        selectAll.disabled = true;
        selectAllTitle.textContent = 'Select All';
        actionBtn.disabled = true;
        document.getElementById('loadArchive').addEventListener('click', async function() {
          this.disabled = true;
          this.textContent = 'Loading…';
          try {
            await loadArchived(true);
            clearStatus();
            render();
          } catch (e) {
            console.error(e);
            setStatus(e.message || 'Could not read the archive.', 'error');
            render();
          }
        });
        return;
      }

      if (!cards.length) {
        listEl.innerHTML = '<div class="state">' + cfg.empty + '</div>';
        selectAll.checked = false;
        selectAll.indeterminate = false;
        selectAll.disabled = true;
        selectAllTitle.textContent = 'Select All';
        actionBtn.disabled = true;
        showTabInfo();
        return;
      }

      selectAll.disabled = false;

      cards.forEach(function(card) {
        const shownList = currentTab === 'past'
          ? (originList(card) ? originList(card).name : listName(card.idList))
          : listName(card.idList);

        const row = document.createElement('label');
        row.className = 'row';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'cbx';
        check.addEventListener('change', syncSelection);

        const box = document.createElement('span');
        box.className = 'box';

        const main = document.createElement('span');
        main.className = 'row-main';

        const title = document.createElement('span');
        title.className = 'row-title';
        title.textContent = card.name;
        title.title = card.name;

        const sub = document.createElement('span');
        sub.className = 'row-sub';
        sub.textContent = shownList;

        main.appendChild(title);
        main.appendChild(sub);
        row.appendChild(check);
        row.appendChild(box);
        row.appendChild(main);

        if (cfg.showAge) {
          const age = document.createElement('span');
          age.className = 'row-age';
          age.textContent = daysOld(card) + 'd inactive';
          row.appendChild(age);
        }

        listEl.appendChild(row);

        rows.push({ card: card, check: check, el: row, sub: sub });
      });

      syncSelection();
      showTabInfo();
    }

    function selectedCards() {
      return rows.filter(r => r.check.checked).map(r => r.card);
    }

    function syncSelection() {
      const total = rows.length;
      const picked = selectedCards().length;

      rows.forEach(r => r.el.classList.toggle('sel', r.check.checked));

      selectAll.checked = picked > 0 && picked === total;
      selectAll.indeterminate = picked > 0 && picked < total;

      selectAllTitle.textContent = picked ? picked + ' of ' + total + ' selected' : 'Select All';

      actionBtn.textContent = TABS[currentTab].action + (picked ? ' ' + picked : '');
      actionBtn.disabled = busy || picked === 0;

      if (!archiveBtn.hidden) {
        // Nothing ticked means the whole eligible list, which is what the old
        // board button did. A ticked selection narrows it, and the count on the
        // button is the promise that nothing else goes.
        archiveBtn.className = 'btn ' + (hasToken ? 'danger' : 'outline');
        archiveBtn.textContent = !hasToken
          ? 'AUTHORIZE TO ARCHIVE'
          : picked ? 'ARCHIVE ' + picked : 'ARCHIVE ALL ' + total;
        archiveBtn.disabled = busy;
      }
    }

    selectAll.addEventListener('change', function() {
      rows.forEach(r => { r.check.checked = selectAll.checked; });
      syncSelection();
    });

    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        // Leaving mid-archive would strand the progress strip on another tab.
        if (busy) return;
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        clearStatus();
        render();
      });
    });

    async function saveProtected(ids) {
      const data = await t.get('board', 'shared') || {};
      await t.set('board', 'shared', Object.assign({}, data, { protectedCards: ids }));
      protectedIds = ids;
    }

    // Bring swept cards back: un-archive them, put them in the list they came
    // from, and drop the origin label.
    async function restoreCards(cards) {
      const token = await authorize();
      const authStr = 'key=' + API_KEY + '&token=' + token;
      const fallback = lists.find(l => l.name.toLowerCase() !== STALE_LIST) || lists[0];

      let done = 0;
      for (const card of cards) {
        const origin = originList(card);
        const target = origin || fallback;
        if (!target) continue;

        setStatus('Restoring ' + (done + 1) + ' of ' + cards.length + '…');

        // closed=false is a no-op on cards that were swept into the old Stale
        // Cards list rather than archived, and idList is set explicitly rather
        // than trusting the archive to have preserved it — so one request
        // handles both generations of swept card.
        const undo = await fetch('https://api.trello.com/1/cards/' + card.id +
          '?closed=false&idList=' + target.id + '&' + authStr, { method: 'PUT' });
        if (!undo.ok) throw new Error('Could not restore "' + card.name + '" (' + undo.status + ')');

        // Mirror the change locally — the board data behind t.cards() can still
        // serve the pre-undo state, which would leave the card stuck in this tab.
        card.idList = target.id;
        card.closed = false;

        if (origin) {
          const label = (card.labels || []).find(l => l.name === origin.name);
          if (label) {
            await fetch('https://api.trello.com/1/cards/' + card.id + '/idLabels/' + label.id + '?' + authStr, { method: 'DELETE' });
            card.labels = card.labels.filter(l => l.id !== label.id);
          }
        }

        // It is a live board card again: out of the archive, into the deck the
        // other tabs are built from.
        if (archivedCards) archivedCards = archivedCards.filter(c => c.id !== card.id);
        if (!allCards.some(c => c.id === card.id)) allCards.push(card);

        done++;
      }
      return done;
    }

    // Archive the given cards: tag each with the list it came from, then close
    // it. The origin label does double duty — it records the way back, and it
    // marks the card as archived BY THIS POWER-UP so the Past tab never offers
    // to undo something the user archived by hand.
    async function archiveCards(cards) {
      const token = await authorize();
      hasToken = true;
      const authStr = 'key=' + API_KEY + '&token=' + token;

      let done = 0;
      for (const card of cards) {
        setProgress('Archiving ' + (done + 1) + ' of ' + cards.length + '…', done / cards.length);

        const origin = listName(card.idList);

        // Label first: the card is harder to reach once it is closed.
        await fetch('https://api.trello.com/1/cards/' + card.id + '/labels?color=null&name=' +
          encodeURIComponent(origin) + '&' + authStr, { method: 'POST' });

        const res = await fetch('https://api.trello.com/1/cards/' + card.id +
          '?closed=true&' + authStr, { method: 'PUT' });
        if (!res.ok) throw new Error('Could not archive "' + card.name + '" (' + res.status + ')');

        // Mirror it locally — the board data behind t.cards() can still serve the
        // pre-archive state, which would leave the card sitting in this tab.
        card.closed = true;
        allCards = allCards.filter(c => c.id !== card.id);

        const row = rows.find(r => r.card.id === card.id);
        if (row) {
          row.el.classList.add('done');
          row.sub.textContent = 'Archived';
        }

        done++;
      }

      // Re-read the archive rather than patching it: the labels just created come
      // back with their real ids, which is what undo needs to strip them again.
      archivedCards = null;
      try {
        await loadArchived(false);
      } catch (e) {
        console.error(e);
      }

      return done;
    }

    archiveBtn.addEventListener('click', async function() {
      if (!hasToken) {
        try {
          await authorize();
          hasToken = true;
          clearStatus();
          render();
        } catch (e) {
          console.error(e);
          setStatus('Trello did not grant access, so nothing was archived.', 'error');
        }
        return;
      }

      const picked = selectedCards();
      const targets = picked.length ? picked : rows.map(r => r.card);
      if (!targets.length) return;

      const plural = targets.length > 1 ? 's' : '';
      askConfirm(
        '<strong>Archive ' + targets.length + ' card' + plural + '?</strong> ' +
        (targets.length > 1 ? 'They leave' : 'It leaves') +
        ' the board and can be undone from Past Decluttered.',
        'ARCHIVE',
        async function() {
          busy = true;
          archiveBtn.textContent = 'ARCHIVING…';
          archiveBtn.disabled = true;
          actionBtn.disabled = true;
          selectAll.disabled = true;

          try {
            const moved = await archiveCards(targets);
            busy = false;
            selectAll.checked = false;
            selectAll.indeterminate = false;
            clearStatus();
            render();
            setStatus('<strong>Archived ' + moved + ' card' + (moved > 1 ? 's' : '') + '.</strong> ' +
              'Undo ' + (moved > 1 ? 'any of them' : 'it') + ' from Past Decluttered.', 'ok');
          } catch (e) {
            console.error(e);
            busy = false;
            render();
            setStatus(e.message || 'Something went wrong while archiving.', 'error');
          }
        }
      );
    });

    actionBtn.addEventListener('click', async function() {
      const cfg = TABS[currentTab];
      const picked = selectedCards();
      if (!picked.length) return;

      const plural = picked.length > 1 ? 's' : '';
      actionBtn.disabled = true;
      selectAll.disabled = true;
      actionBtn.textContent = cfg.busy;

      try {
        if (currentTab === 'upcoming') {
          const ids = protectedIds.slice();
          picked.forEach(c => { if (!ids.includes(c.id)) ids.push(c.id); });
          await saveProtected(ids);
          setStatus('Protected ' + picked.length + ' card' + plural + '. They will be skipped by the sweeper.', 'ok');

        } else if (currentTab === 'protected') {
          // Ticked rows lose their protection; every other protected id is left
          // alone, including ones not shown here (archived cards, other boards).
          const drop = picked.map(c => c.id);
          await saveProtected(protectedIds.filter(id => drop.indexOf(id) === -1));
          setStatus('Un-protected ' + drop.length + ' card' + plural + '. ' +
            (drop.length > 1 ? 'They are' : 'It is') + ' eligible for the next sweep again.', 'ok');

        } else {
          const moved = await restoreCards(picked);
          setStatus('Restored ' + moved + ' card' + (moved > 1 ? 's' : '') + ' to ' +
            (moved > 1 ? 'their original lists' : 'its original list') + '.', 'ok');
        }

        actionBtn.textContent = cfg.action;
        selectAll.checked = false;
        selectAll.indeterminate = false;
        render();

      } catch (e) {
        console.error(e);
        selectAll.disabled = false;
        syncSelection();
        setStatus(e && e.message && currentTab === 'past'
          ? e.message + ' Make sure the Power-Up is authorized.'
          : 'Something went wrong. If this was an undo, make sure the Power-Up is authorized.', 'error');
      }
    });

    t.render(function() {
      Promise.all([
        t.get('board', 'shared'),
        t.lists('all'),
        t.cards('id', 'name', 'idList', 'labels')
      ]).then(function([boardData, boardLists, cards]) {
        settings = boardData || {};
        protectedIds = settings.protectedCards || [];
        lists = boardLists;
        allCards = cards;
        render();

        // Whether we hold a token decides what the archive button says, so settle
        // it up front. Checking never prompts.
        t.getRestApi().isAuthorized().then(function(authorized) {
          hasToken = authorized;
          syncSelection();
        }).catch(function(e) { console.error(e); });

        // Fill the archive in behind the scenes if we already hold a token, so
        // the Past tab is populated before it is opened. Never prompts.
        loadArchived(false).then(function(loaded) {
          if (loaded) render();
        }).catch(function(e) { console.error(e); });
      }).catch(function(e) {
        console.error(e);
        listEl.innerHTML = '<div class="state">Could not load the board. Try reopening this window.</div>';
      });
    });
  </script>
</body>
</html>
