<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { padding: 12px; font-family: -apple-system, sans-serif; }
    .row { margin-bottom: 12px; }
    @media (prefers-color-scheme: dark) {
      body { color: #b6c2cf; background-color: #282e33; }
      input[type="number"] { background: #22272b; color: white; border: 1px solid #738496; }
    }
  </style>
</head>
<body>
  <div class="row">
    <label><input type="checkbox" id="enableToggle" /> Allow archiving from Declutter Preview</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="ignoreStarterToggle" checked /> Ignore "Trello Starter Guide" list</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="hideBadgesToggle" /> Hide Age Badges (Front & Back)</label>
  </div>
  <div class="row">
    <label for="daysInput">Days Inactive before sweeping:</label>
    <input type="number" id="daysInput" value="30" style="width: 60px;" />
  </div>
  <button id="saveBtn" class="mod-primary">Save Settings</button>

  <script>
    // 🚨 PASTE YOUR API KEY HERE BETWEEN THE QUOTES
    const API_KEY = '13984ce4cf66fea26a4e36da6b01ffdc';

    var t = window.TrelloPowerUp.iframe({
      appKey: API_KEY,
      appName: 'Board Declutter'
    });

    // 1. Load Settings
    t.render(function() {
      t.get('board', 'shared').then(function(data) {
        if (data) {
          document.getElementById('enableToggle').checked = data.sweepEnabled || false;
          document.getElementById('ignoreStarterToggle').checked = data.ignoreStarter !== false; 
          document.getElementById('hideBadgesToggle').checked = data.hideBadges || false; 
          document.getElementById('daysInput').value = Number.isFinite(data.sweepThreshold) ? data.sweepThreshold : 30;
        }
      });
    });

    // 🚀 SMART RECONCILIATION LOGIC
    async function enforceNewSettings(isEnabled, ignoreStarter, thresholdDays) {
      try {
        const lists = await t.lists('all');
        const staleList = lists.find(l => l.name.toLowerCase() === 'stale cards');

        // Cards swept before the switch to archiving still sit in the old list.
        const allCards = await t.cards('id', 'idList', 'labels');
        const cardsInStale = staleList ? allCards.filter(c => c.idList === staleList.id) : [];

        // Decluttered cards are archived now, and the archive can only be read
        // with a token. Don't force an authorize prompt on a board that has
        // never been swept — if there is no token and no legacy Stale Cards
        // work, there is nothing worth prompting for.
        const isAuth = await t.getRestApi().isAuthorized();
        if (!isAuth && !cardsInStale.length) return;
        if (!isAuth) {
          await t.getRestApi().authorize({ scope: 'read,write', expiration: '30days' });
        }

        const token = await t.getRestApi().getToken();
        const authStr = `key=${API_KEY}&token=${token}`;

        let archivedCards = [];
        try {
          const res = await fetch(`https://api.trello.com/1/boards/${t.getContext().board}/cards/closed?fields=id,idList,labels,closed&${authStr}`);
          if (res.ok) archivedCards = await res.json();
        } catch (e) { console.error("Could not read archive:", e); }

        const candidates = cardsInStale.concat(archivedCards);
        if (!candidates.length) return;

        const fallbackListId = lists[0].id;
        const now = new Date();

        // Check every decluttered card against the NEW rules
        for (const card of candidates) {
          let targetListId = null;
          let labelToRemoveId = null;
          let originalListName = "";

          // Figure out where it came from
          for (const label of (card.labels || [])) {
            const matchedList = lists.find(l => l.name === label.name);
            if (matchedList) {
              targetListId = matchedList.id;
              labelToRemoveId = label.id;
              originalListName = matchedList.name.toLowerCase();
              break;
            }
          }

          // No origin label on an archived card means the user archived it
          // themselves. Never un-archive someone else's work.
          if (!targetListId) {
            if (card.closed) continue;
            targetListId = fallbackListId;
          }

          // Calculate its actual age
          const creationTimestamp = parseInt(card.id.substring(0, 8), 16) * 1000;
          const daysOld = Math.floor((now - new Date(creationTimestamp)) / 86400000);

          let shouldRestore = false;

          // RULE 1: If the whole feature is turned off, restore it.
          if (!isEnabled) {
            shouldRestore = true; 
          } 
          // RULE 2: If we are ignoring the Starter Guide again, restore starter cards.
          else if (ignoreStarter && originalListName === 'trello starter guide') {
            shouldRestore = true; 
          } 
          // RULE 3: If the threshold went up, and this card is no longer old enough, restore it.
          else if (daysOld < thresholdDays) {
            shouldRestore = true; 
          }

          // Bring the card back if it failed the new rules. closed=false is a
          // no-op for legacy cards sitting in the Stale Cards list.
          if (shouldRestore) {
            await fetch(`https://api.trello.com/1/cards/${card.id}?closed=false&idList=${targetListId}&${authStr}`, { method: 'PUT' });
            if (labelToRemoveId) {
              await fetch(`https://api.trello.com/1/cards/${card.id}/idLabels/${labelToRemoveId}?${authStr}`, { method: 'DELETE' });
            }
          }
        }
      } catch (e) { console.error("Enforce settings failed:", e); }
    }

    // 2. Save Button Click
    document.getElementById('saveBtn').addEventListener('click', async function() {
      const btn = document.getElementById('saveBtn');
      btn.textContent = "Applying Settings...";
      btn.disabled = true;

      const isEnabled = document.getElementById('enableToggle').checked;
      const ignoreStarter = document.getElementById('ignoreStarterToggle').checked;
      const hideBadges = document.getElementById('hideBadgesToggle').checked;
      const parsedDays = parseInt(document.getElementById('daysInput').value, 10);
      // Note: 0 is a valid threshold ("sweep everything"), so don't fall back on it.
      const days = Number.isFinite(parsedDays) && parsedDays >= 0 ? parsedDays : 30;

      // Persist FIRST. Reconciliation needs REST authorization, and settings must
      // never be lost just because that prompt was dismissed or failed.
      const currentData = await t.get('board', 'shared') || {};

      await t.set('board', 'shared', {
        ...currentData,
        'sweepEnabled': isEnabled,
        'ignoreStarter': ignoreStarter,
        'hideBadges': hideBadges,
        'sweepThreshold': days
      });

      btn.textContent = "✔ Saved!";
      btn.style.backgroundColor = "#61bd4f";
      btn.style.color = "white";

      // Then boot out any cards that no longer belong in Stale Cards.
      await enforceNewSettings(isEnabled, ignoreStarter, days);

      setTimeout(function() { try { t.closePopup(); } catch(e) {} }, 1000);
    });
  </script>
</body>
</html>
